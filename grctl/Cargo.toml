[package]
name = "grctl"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
humantime = "2.1"
nix = { version = "0.27", features = ["process", "signal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.8", features = ["v4"] }
walkdir = "2.5"
grim_telemetry_common = { path = "../grim_telemetry_common" }

[dev-dependencies]
tempfile = "3.10"
